<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0010">
  <title>Game Over — Il Labirinto di Gip</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap');

    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#170008;
      color:#fff4f8;
      font-family:"Source Sans 3", Arial, sans-serif;
      touch-action:manipulation;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(
          circle at 50% 35%,
          #65152c 0%,
          #310512 45%,
          #140006 100%
        );
    }

    .fog{
      position:fixed;
      inset:-30%;
      background:
        radial-gradient(
          ellipse at 30% 50%,
          rgba(255, 80, 104, 0.16),
          transparent 36%
        ),
        radial-gradient(
          ellipse at 75% 40%,
          rgba(138, 25, 65, 0.22),
          transparent 34%
        );
      filter:blur(22px);
      animation:fogMove 9s ease-in-out infinite alternate;
      pointer-events:none;
    }

    .particles{
      position:fixed;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }

    .particle{
      position:absolute;
      color:#ff879e;
      text-shadow:
        0 0 8px #ff354f,
        0 0 16px #b91536;
      opacity:0;
      animation:ashFall linear infinite;
    }

    .gameover-card{
      position:relative;
      z-index:2;
      width:min(92vw, 510px);
      max-height:calc(100dvh - 24px);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:
        calc(26px + var(--safe-top))
        24px
        calc(24px + var(--safe-bottom));
      border:1px solid rgba(255, 150, 171, 0.48);
      border-radius:26px;
      background:
        linear-gradient(
          145deg,
          rgba(91, 13, 37, 0.95),
          rgba(30, 0, 12, 0.97)
        );
      text-align:center;
      box-shadow:
        0 18px 64px rgba(0, 0, 0, 0.64),
        0 0 42px rgba(255, 47, 88, 0.3),
        inset 0 1px rgba(255, 255, 255, 0.12);
      animation:cardIn .75s cubic-bezier(.2,.85,.3,1) both;
    }

    .skull{
      margin-bottom:8px;
      font-size:clamp(46px, 14vw, 78px);
      filter:drop-shadow(0 0 14px rgba(255, 62, 94, 0.85));
      animation:skullShake 2.4s ease-in-out infinite;
    }

    h1{
      margin:0;
      color:#fff3f5;
      font-family:"Cinzel", serif;
      font-size:clamp(37px, 12vw, 70px);
      font-weight:800;
      letter-spacing:clamp(1px, 1vw, 7px);
      line-height:1;
      text-shadow:
        0 0 8px #fff,
        0 0 25px #ff3d5c,
        0 0 55px #8e0b28;
    }

    .line{
      width:min(245px, 70%);
      height:2px;
      margin:19px auto 16px;
      background:
        linear-gradient(
          90deg,
          transparent,
          #ffb2c1,
          #fff,
          #ffb2c1,
          transparent
        );
      box-shadow:0 0 16px #ff3f60;
    }

    .message{
      margin:0;
      color:#ffd8e1;
      font-family:"Dancing Script", cursive;
      font-size:clamp(29px, 8vw, 45px);
      font-weight:700;
      line-height:1.12;
      text-shadow:0 0 15px rgba(255, 82, 116, 0.72);
    }

    .text{
      max-width:360px;
      margin:17px auto 22px;
      color:#ffe7ec;
      font-size:17px;
      font-weight:600;
      line-height:1.4;
    }

    .level-info{
      display:inline-block;
      margin:0 auto 18px;
      padding:8px 16px;
      border:1px solid rgba(255, 160, 180, 0.4);
      border-radius:12px;
      background:rgba(0, 0, 0, 0.28);
      color:#ffd3dc;
      font-family:"Cinzel", serif;
      font-size:14px;
      font-weight:700;
      letter-spacing:1px;
    }

    .level-info span{
      color:#fff;
      font-weight:800;
    }

    /* Riepilogo run (nuovo) */
    .run-summary{
      max-width:320px;
      margin:0 auto 18px;
      padding:12px 14px;
      border:1px solid rgba(255, 160, 180, 0.25);
      border-radius:12px;
      background:rgba(0, 0, 0, 0.25);
      text-align:left;
    }
    .run-summary .run-title{
      margin-bottom:8px;
      color:#ffd54a;
      font-family:"Cinzel", serif;
      font-size:12px;
      font-weight:800;
      letter-spacing:1px;
      text-align:center;
    }
    .run-summary .run-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:5px 0;
      color:#ffe5ef;
      font-size:14px;
      font-weight:600;
    }
    .run-summary .run-row span{
      color:#fff;
      font-weight:800;
    }
    .run-summary .run-row i{
      width:20px;
      margin-right:6px;
      color:#ff8abb;
      text-align:center;
    }

    .redirect-note{
      margin:18px 0 0;
      color:rgba(255, 208, 219, 0.74);
      font-size:13px;
      font-weight:600;
      line-height:1.3;
    }

    @keyframes cardIn{
      from{
        opacity:0;
        transform:translateY(30px) scale(.91);
      }

      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    @keyframes skullShake{
      0%,
      100%{
        transform:rotate(-3deg) scale(.97);
      }

      50%{
        transform:rotate(3deg) scale(1.06);
      }
    }

    @keyframes fogMove{
      from{
        transform:translate3d(-3%, -2%, 0) scale(1);
      }

      to{
        transform:translate3d(4%, 3%, 0) scale(1.1);
      }
    }

    @keyframes ashFall{
      0%{
        opacity:0;
        transform:translate3d(0, -10vh, 0) rotate(0deg);
      }

      12%{
        opacity:.8;
      }

      100%{
        opacity:0;
        transform:translate3d(35px, 110vh, 0) rotate(230deg);
      }
    }

    @media (prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="fog"></div>
  <div id="particles" class="particles"></div>

  <main class="gameover-card">
    <div class="skull">💔</div>
    <h1>GAME OVER</h1>
    <div class="line"></div>
    <p class="message">Il labirinto ha vinto…</p>
    <p class="text">
      Gip è stato raggiunto dalle ombre del labirinto.
      Riprova, raccogli i forzieri e usa con cura scudi e munizioni.
    </p>

    <div class="level-info">
      Livello raggiunto: <span id="gameover-level">1</span>
    </div>

    <div class="run-summary" id="run-summary" style="display:none;">
      <div class="run-title">RIEPILOGO RUN</div>
      <div class="run-row"><span><i class="fas fa-clock"></i>Tempo totale</span><span id="gameover-time">00:00</span></div>
      <div class="run-row"><span><i class="fas fa-shoe-prints"></i>Mosse totali</span><span id="gameover-moves">0</span></div>
      <div class="run-row"><span><i class="fas fa-coins"></i>Monete raccolte</span><span id="gameover-coins">0</span></div>
    </div>

    <p class="redirect-note">Verrai reindirizzato alla schermata dei record tra 5 secondi…</p>
  </main>

  <script>
    /* ============ LEGGI LIVELLO, POI RESET ============ */
    let retryLevel = 1;
    try {
      const raw = localStorage.getItem('labirinto_state');
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.level >= 1 && s.level <= 15) {
          retryLevel = s.level;
        }
      }
    } catch(_) {}

    // Mostra il livello raggiunto
    const levelEl = document.getElementById('gameover-level');
    if (levelEl) levelEl.textContent = String(retryLevel);

    /* ============ RIEPILOGO RUN (nuovo) ============ */
    // Legge le statistiche cumulative della run corrente PRIMA di eventuali reset.
    // NB: labirinto_cumulative NON viene mai cancellato da gameover.html — è
    // azzerato solo da "Nuova avventura" in index.html. Mostriamo quindi i totali
    // accumulati fino a questo game over.
    try {
      const cum = JSON.parse(localStorage.getItem('labirinto_cumulative') || 'null');
      if (cum && (cum.time > 0 || cum.moves > 0 || cum.coins > 0)) {
        const m = Math.floor((cum.time || 0) / 60);
        const s = (cum.time || 0) % 60;
        document.getElementById('gameover-time').textContent =
          String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        document.getElementById('gameover-moves').textContent = String(cum.moves || 0);
        document.getElementById('gameover-coins').textContent = String(cum.coins || 0);
        document.getElementById('run-summary').style.display = 'block';
      }
    } catch(_) {}

    /* ============ RESET STATO PER NUOVA RUN ============ */
    // Importante: viene chiamato DOPO aver letto tutto ciò che serve a questa
    // schermata. NON cancella labirinto_profile, labirinto_achievements,
    // labirinto_cumulative né labirinto_last_result (servono a record.html).
    try {
      localStorage.removeItem('labirinto_state');
      localStorage.removeItem('labirinto_resume');
      localStorage.removeItem('labirinto_hp');
      localStorage.removeItem('labirinto_shields');
      localStorage.removeItem('labirinto_ammo');
      localStorage.removeItem('labirinto_next_url');
    } catch(_) {}

    /* ============ PARTICELLE CENERE ============ */
    const particles = document.getElementById('particles');
    const symbols = ['✦', '✧', '•', '◆', '✹'];
    for(let i = 0; i < 30; i++){
      const particle = document.createElement('span');
      particle.className = 'particle';
      particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      particle.style.left = (Math.random() * 100) + '%';
      particle.style.fontSize = (10 + Math.random() * 19) + 'px';
      particle.style.animationDuration = (4 + Math.random() * 5) + 's';
      particle.style.animationDelay = (-Math.random() * 8) + 's';
      particles.appendChild(particle);
    }

    /* ============ REDIRECT DOPO 5 SECONDI ============ */
    setTimeout(() => {
      window.location.replace('record.html');
    }, 5000);
  </script>
</body>
</html>
